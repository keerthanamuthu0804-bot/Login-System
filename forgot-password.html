<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <form class="login-card" id="resetForm">
      <!-- Heading -->
      <h2>Reset Password</h2>
      <p>Enter your email and new password to reset your account password.</p>

      <!-- Email input -->
      <div class="input-group">
        <input type="email" id="email" placeholder="Email Address" required>
      </div>

      <!-- New password input -->
      <div class="input-group password-box">
        <input type="password" id="newPassword" placeholder="New Password" required>
        <span id="toggleNewPassword">Show</span>
      </div>

      <!-- Reset button -->
      <button type="submit">Reset Password</button>

      <!-- Back link -->
      <a href="index.html" class="back-link">← Back to Login</a>
    </form>
  </div>

  <!-- JS -->
  <script src="reset.js"></script>
  <script>
    // Toggle new password show/hide
    const toggleNewPassword = document.getElementById("toggleNewPassword");
    const newPasswordInput = document.getElementById("newPassword");

    if (toggleNewPassword && newPasswordInput) {
      toggleNewPassword.addEventListener("click", () => {
        const type = newPasswordInput.type === "password" ? "text" : "password";
        newPasswordInput.type = type;
        toggleNewPassword.textContent = type === "password" ? "Show" : "Hide";
      });
    }
  </script>
</body>
</html>
